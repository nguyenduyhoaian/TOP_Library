<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Library</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <h1> My Library</h1>
    <div class="library"></div>






    <dialog id="my-dialog">
        <form id="addnewbook">

            <label for="author">Author:</label>
            <input type="text" id="author" name="author">

            <label for="title">Title:</label>
            <input type="text" id="title" name="title">

            <label for="numofpage">Title:</label>
            <input type="text" id="numofpage" name="numofpage">

            <label for="isread">Is read:</label>
            <input type="checkbox" id="isread" name="isread">
            <div id="submit-button">
                <button type="button" commandfor="my-dialog" command="close">Add</button>
                <button type="button" commandfor="my-dialog" command="close">Close</button>
            </div>
        </form>


    </dialog>

    <script src="script.js"></script>
</body>

</html>
